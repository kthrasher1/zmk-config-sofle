# ZMK main (Zephyr 4.1): boards use the new "hardware model v2" names with the
# `//zmk` variant. The dongle (XIAO BLE + Prospector) is the central; both
# halves are peripherals.
---
include:
  - board: xiao_ble//zmk
    shield: sofle_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: sofle_left
  - board: nice_nano//zmk
    shield: sofle_right
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
