# ZMK v0.3 (Zephyr 3.5): use the old-style board names.
# The dongle (XIAO BLE + Prospector) is the central; both halves are peripherals.
---
include:
  - board: seeeduino_xiao_ble
    shield: sofle_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: sofle_left
  - board: nice_nano_v2
    shield: sofle_right
  - board: nice_nano_v2
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
