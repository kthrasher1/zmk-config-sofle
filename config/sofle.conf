# Applies to ALL sofle_* builds (left, right and dongle). Keep this to
# options that are valid on every one of them.

### Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="KT Sofle"

### Boost Bluetooth power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enables settings planned to become default in future ZMK versions to improve
# connection stability (BLE pairing timing, new LLCP, no 2M PHY).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
