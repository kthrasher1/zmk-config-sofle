# Dongle only (XIAO BLE + Prospector). The dongle is the split central and
# the USB/host-facing device, so host-side features live here.

### ZMK Studio (needs the studio-rpc-usb-uart snippet from build.yaml)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### Pointing / mouse emulation (processed on the central)
CONFIG_ZMK_POINTING=y

### Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

### Prospector status screen (Classic is the default)
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

### Prospector options (see the module README)
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=n
# If the build fails with "region RAM overflowed":
# CONFIG_LV_Z_VDB_SIZE=25
### Debug
# CONFIG_ZMK_USB_LOGGING=y

CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80




